<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName juane-risk-lab.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader set X-Forwarded-Proto "https"

SSLCertificateFile /etc/letsencrypt/live/juane-risk-lab.duckdns.org/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/juane-risk-lab.duckdns.org/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
