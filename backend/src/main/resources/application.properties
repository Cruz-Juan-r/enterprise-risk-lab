spring.application.name=enterprise-risk-api
server.port=8080

# Auth0 - the issuer MUST start with https:// and end with a trailing slash
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-d6h1xipnfpe8pv51.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://enterprise-risk-api}

# Exact origins allowed to call the API from a browser (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://juane-risk-lab.duckdns.org}

# Only expose the health endpoint
management.endpoints.web.exposure.include=health
